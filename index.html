<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Argos Waiting - Casanova Frankenstein Jr.</title>
<style>
body {
  background:black;
  overflow:hidden;
  color:white;
  font-family:'Canterbury', sans-serif;
  margin:0;
  padding:0;
}

/* ============================= */
/* DOG GAME WINDOW */
/* ============================= */

#gameOverlay {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 5000;
}

#gameWindow {
  width: 520px;
  background: rgba(0,0,0,0.9);
  border: 2px solid white;
  border-radius: 10px;
  box-shadow: 0 0 25px rgba(255,255,255,0.4);
  padding: 15px;
  text-align: center;
}

#gameTitle {
  font-size: 20px;
  margin-bottom: 10px;
  text-shadow:
    0 0 4px #fff,
    0 0 8px #ff00ff,
    0 0 12px #00ffff;
}

#dogGame {
  background: black;
  border: 2px solid white;
  display: block;
  margin: 0 auto;
}

#gameButtons {
  margin-top: 15px;
  display: flex;
  justify-content: center;
  gap: 15px;
}

#restartBtn,
#presaveBtn {
  padding: 10px 25px;
  font-size: 16px;
  cursor: pointer;
  background: black;
  color: white;
  border: 2px solid white;
  border-radius: 6px;
  font-family: monospace;
  text-shadow:
    0 0 4px #fff,
    0 0 8px #ff00ff,
    0 0 12px #00ffff;
}

#restartBtn:hover,
#presaveBtn:hover {
  background: white;
  color: black;
}

/* Canvas setup */
canvas {
  display:block;
  background:black;
}

/* Font */
@font-face {
  font-family:'Canterbury';
  src:url('Canterbury.ttf') format('truetype');
}

/* Date style */
#date {
  position:absolute;
  top:0;
  left:0;
  right:0;
  margin:0 auto;
  width:95%;
  text-align:center;
  font-size:40px;
  color:white;
  pointer-events:none;
  z-index:2000;
  text-shadow:
    0 0 2px #fff,
    0 0 4px #fff,
    0 0 6px #fff,
    0 0 8px #ff00ff,
    0 0 10px #00ffff;
  animation:textFlicker 0.15s infinite;
}

/* Play button */
#playButton {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  padding:20px 40px;
  font-size:30px;
  cursor:pointer;
  border:2px solid white;
  background:rgba(0,0,0,0.7);
  color:white;
  border-radius:10px;
  z-index:2000;
  text-shadow:
    0 0 2px #fff,
    0 0 4px #fff,
    0 0 6px #fff,
    0 0 8px #ff00ff,
    0 0 10px #00ffff;
  animation:textFlicker 0.15s infinite;
}

/* Footer */
#footer {
  font-size:30px;
  position:absolute;
  bottom:50px;
  width:93%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
  z-index:2000;
  text-shadow:
    0 0 1px #fff,
    0 0 2px #fff,
    0 0 3px #fff,
    0 0 4px #ff00ff,
    0 0 5px #00ffff;
  animation:textFlicker 0.15s infinite;
}

/* Flicker animation */
@keyframes textFlicker {
  0%,100% { opacity:1; }
  50% { opacity:0.9; }
}
</style>
</head>
<body>

<div id="date">
Casanova Frankenstein Jr <br>
Argos Waiting <br>
03/13/26
</div>

<div id="playButton">listen</div>

<canvas id="dvd"></canvas>

<div id="footer">
Why........................ "all because he found me, tied to a pole" <br>
for vincent & henry
</div>

<audio id="background-music" src="song.mp3" loop></audio>
<script>
// Background bouncing logo
const bgCanvas = document.getElementById('dvd');
const bgCtx = bgCanvas.getContext('2d');

function resizeCanvas() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const bgImg = new Image();
bgImg.src = 'cover.png';

let x=50,y=50,dx=1.5,dy=2.5,width=200,height=200;

bgImg.onload = () => {
  function animate(){
    bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
    bgCtx.drawImage(bgImg,x,y,width,height);
    x+=dx; y+=dy;
    if(x<0||x+width>bgCanvas.width)dx=-dx;
    if(y<0||y+height>bgCanvas.height)dy=-dy;
    requestAnimationFrame(animate);
  }
  animate();
};

// Play button
const audio = document.getElementById('background-music');
const playButton = document.getElementById('playButton');

playButton.addEventListener('click',()=>{
  audio.play();
  playButton.style.display='none';
  document.getElementById("gameOverlay").style.display="flex";
  startDogGame();
});
</script>

<script>
function startDogGame(){
  const canvas=document.getElementById("dogGame");
  const ctx=canvas.getContext("2d");
  const restartBtn=document.getElementById("restartBtn");
  const presaveBtn=document.getElementById("presaveBtn");

  const dogImg = new Image();
  dogImg.src = "dog.png";

  const mailImg = new Image();
  mailImg.src = "mail.png";

  let dog,obstacles,score,gameOver,interval;

  const groundY = 180;   // ground line
  const dogTargetHeight = 55;  // NEW bigger dog size

  dogImg.onload = function(){

    // maintain aspect ratio
    const aspectRatio = dogImg.naturalWidth / dogImg.naturalHeight;
    const dogWidth = dogTargetHeight * aspectRatio;
    const dogHeight = dogTargetHeight;

    function init(){
      dog={
        x:50,
        y:groundY - dogHeight,
        width:dogWidth,
        height:dogHeight,
        vy:0,
        gravity:0.6,
        jump:-14,
        grounded:true
      };

      obstacles=[];
      score=0;
      gameOver=false;

      restartBtn.style.display="none";
      presaveBtn.style.display="none";

      clearInterval(interval);
      interval=setInterval(spawn,1500);
      update();
    }

    function spawn(){
      obstacles.push({
        x:canvas.width,
        width:30,
        height:50,
        y:groundY - 50
      });
    }

    function update(){
      if(gameOver)return;
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // Ground
      ctx.fillStyle="#444";
      ctx.fillRect(0,groundY,canvas.width,5);

      // Physics
      dog.vy+=dog.gravity;
      dog.y+=dog.vy;

      if(dog.y >= groundY - dog.height){
        dog.y = groundY - dog.height;
        dog.vy = 0;
        dog.grounded = true;
      }

      // Draw dog (scaled naturally)
      ctx.drawImage(dogImg,dog.x,dog.y,dog.width,dog.height);

      obstacles.forEach((o,i)=>{
        o.x-=4;

        ctx.drawImage(mailImg,o.x,o.y,o.width,o.height);

        if(
          dog.x<o.x+o.width &&
          dog.x+dog.width>o.x &&
          dog.y<o.y+o.height &&
          dog.y+dog.height>o.y
        ){
          gameOver=true;
          clearInterval(interval);

          ctx.fillStyle="white";
          ctx.font="20px monospace";
          ctx.fillText("GAME OVER",170,100);

          restartBtn.style.display="inline-block";
          presaveBtn.style.display="inline-block";
        }

        if(o.x+o.width<0){
          obstacles.splice(i,1);
          score++;
        }
      });

      ctx.fillStyle="white";
      ctx.font="16px monospace";
      ctx.fillText("Score: "+score,10,20);

      requestAnimationFrame(update);
    }

    document.addEventListener("keydown",e=>{
      if(e.code==="Space" && dog.grounded && !gameOver){
        dog.vy=dog.jump;
        dog.grounded=false;
      }
    });

    restartBtn.onclick=()=>init();
    presaveBtn.onclick=()=>window.open("https://linktr.ee/casanovafrankensteinjr","_blank");

    init();
  };
}
</script>



<div id="gameOverlay">
  <div id="gameWindow">
    <div id="gameTitle">argos running <br> !escape from the pole!</div>
    <canvas id="dogGame" width="500" height="200"></canvas>
    <div id="gameButtons">
      <button id="restartBtn" style="display:none;">try again</button>
      <button id="presaveBtn" style="display:none;">pre-save the album</button>
    </div>
  </div>
</div>

</body>
</html>
