<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Argos Waiting - Casanova Frankenstein Jr.</title>
<style>
body {
  background:black;
  overflow:hidden;
  color:white;
  font-family:'Canterbury', sans-serif;
  margin:0;
  padding:0;
}

/* Canvas setup */
canvas {
  display:block;
  background:black;

}

/* Font */
@font-face {
  font-family:'Canterbury';
  src:url('Canterbury.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

/* Date style */
#date {
  position:absolute;
  top:0;
  left: 0;
right: 0;
margin: 0 auto;
width: 95%;

  text-align:center;
  font-size:40px;
  color:white;
  pointer-events:none;
  font-family:'Canterbury', sans-serif;
  z-index:2000;
  text-shadow:
    0 0 2px #fff,
    0 0 4px #fff,
    0 0 6px #fff,
    0 0 8px #ff00ff,
    0 0 10px #00ffff;
  animation: textFlicker 0.15s infinite;
}

/* Play button style */
#playButton {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  padding:20px 40px;
  font-size:30px;
  cursor:pointer;
  border:2px solid white;
  background: rgba(0,0,0,0.7);
  color:white;
  border-radius:10px;
  z-index:2000;
  text-shadow:
    0 0 2px #fff,
    0 0 4px #fff,
    0 0 6px #fff,
    0 0 8px #ff00ff,
    0 0 10px #00ffff;
  animation: textFlicker 0.15s infinite;
}

/* Footer */
#footer {
  font-size: 30px;
  line-height: 1.5;
  position: absolute;
  bottom: 50px;

  width: 93%;          /* use width instead of max-width */
  left: 50%;
  transform: translateX(-50%);

  text-align: center;
  color: white;
  pointer-events: none;
  font-family: 'Canterbury', sans-serif;
  word-wrap: break-word;
  z-index: 2000;

  text-shadow:
    0 0 1px #fff,
    0 0 2px #fff,
    0 0 3px #fff,
    0 0 4px #ff00ff,
    0 0 5px #00ffff;

  animation: textFlicker 0.15s infinite;
}


#linktree {
  display:block;
  margin-top:10px;
  font-size:40px;
  text-decoration:underline;
  cursor:pointer;
  pointer-events:auto;
  color:white;
}

/* Mobile styles */
@media (max-width: 769px) {
  #date {
    font-size: 40px; /* bigger text on mobile */
  }

  #footer {
    font-size: 15px !important;

  }

  #playButton {
    font-size: 30px;
    padding: 30px 50px;
  }

  #linktree {
    font-size: 40px;
  }
}


/* Text flicker animation */
@keyframes textFlicker {
  0%, 100% { opacity:1; }
  25% { opacity:0.95; }
  50% { opacity:0.9; }
  75% { opacity:0.97; }
}

/* CRT overlay for canvas */
#crt-overlay {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1500; /* BELOW text */
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.15) 2px,
    transparent 2px,
    transparent 4px
  );
  background-size:100% 4px;
  animation: crtScroll 0.2s infinite linear, crtFlicker 0.1s infinite;
}

/* Whole screen power flicker */
#screen-flicker {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1600; /* below scanlines, below text */

  background: #888;
  opacity: 0;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1700;
  background: radial-gradient(circle at center, transparent 60%, black 100%);
}


#noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1700;
  opacity: 0.03;
  background-image: url("https://grainy-gradients.vercel.app/noise.svg");
}


/* Scanline scroll */
@keyframes crtScroll {
  0% { background-position:0 0; }
  100% { background-position:0 4px; }
}

/* Scanline flicker */
@keyframes crtFlicker {
  0%,100% { opacity:0.6; }
  50% { opacity:0.7; }
}
</style>
</head>
<body>

<div id="screen-flicker"></div>
<div id="crt-overlay"></div>
<div id="noise"></div>


<!-- Date and Linktree -->
<div id="date"> 
Casanova Frankenstein Jr <br> Argos Waiting <br> 03/13/26 
  <a id="linktree" href="https://linktr.ee/casanovafrankensteinjr" target="_blank">pre save here</a> 
</div>

<!-- Play button -->
<div id="playButton">listen</div>

<!-- Canvas for bouncing logo -->
<canvas id="dvd"></canvas>

<!-- Footer text -->
<div id="footer">
	WHY........................ "all because he found me, tied to a pole" <br> for vincent & henry
</div>

<!-- Background music -->
<audio id="background-music" src="song.mp3" loop></audio>

<script>
// Canvas setup
const canvas = document.getElementById('dvd');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(1, 0, 0, 1, 0, 0); // reset transform
  ctx.scale(dpr, dpr);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Logo image
const img = new Image();
img.src = 'cover.png';

let x = 50, y = 50;
let dx = 1.5, dy = 2.5;   // slightly smoother movement
const width = 200;
const height = 200;

let hue = 0;
let hueSpeed = 0.3;      // slower, more analog feel

img.onload = () => {
  function animate() {
  // Clear using CSS pixel dimensions, not scaled pixel dimensions
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  // Draw logo
  ctx.drawImage(img, x, y, width, height);

  // Apply hue rotation safely
  canvas.style.filter =
    "brightness(1.2) contrast(1.4) blur(0.5px) hue-rotate(" + hue + "deg)";

  // Move logo
  x += dx;
  y += dy;

  // Bounce using CSS pixel dimensions
  if (x < 0 || x + width > window.innerWidth) dx = -dx;
  if (y < 0 || y + height > window.innerHeight) dy = -dy;

  // Smooth hue cycle
  hue += hueSpeed;
  if (hue >= 360) hue = 0;

if (Math.random() > 0.99) {
  ctx.drawImage(img, x + 10, y, width, height);
}

if (Math.random() > 0.99) {
  canvas.style.filter += " brightness(0.2)";
  setTimeout(() => {
    canvas.style.filter =
      "brightness(1.2) contrast(1.4) blur(0.5px) hue-rotate(" + hue + "deg)";
  }, 120);
}


  requestAnimationFrame(animate);
if (Math.random() > 0.995) {
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  const glitchY = Math.random() * window.innerHeight;
  ctx.fillRect(0, glitchY, window.innerWidth, 2);
}

}


  animate();
};

// Play button functionality
const audio = document.getElementById('background-music');
const playButton = document.getElementById('playButton');

playButton.addEventListener('click', () => {
  audio.play();
  playButton.style.display = 'none';
});

// Random CRT power flicker
const flickerLayer = document.getElementById('screen-flicker');

function randomFlicker() {
  const intensity = Math.random() * 0.12; // subtle grey flash
  flickerLayer.style.opacity = intensity;

  setTimeout(() => {
    flickerLayer.style.opacity = 0;
  }, 40 + Math.random() * 60); // quick flash
}

// Random intervals (analog feeling)
setInterval(() => {
  if (Math.random() > 0.8) { // 30% chance each cycle
    randomFlicker();
  }
}, 120);

</script>


</body>
</html>
